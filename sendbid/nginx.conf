# Sert Sendbid (app.*) ET Paybid (agent.*) depuis le même bundle Expo Web.
# Le routing est géré côté client par Expo Router + détection hostname dans _layout.tsx.
# Traefik/Dokploy place ce container derrière les 2 hostnames.

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/octet-stream;

    # Cache des assets statiques (1 an, fingerprint dans le nom de fichier par expo)
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback : toutes les routes inconnues → index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Healthcheck simple
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
