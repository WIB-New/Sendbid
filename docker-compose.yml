# =================================================================
# Dokploy SENDBID/PAYBID — Docker Compose (audité 12/06/2026)
#
# IMPORTANT : Aucune valeur en dur. Toutes les variables sont injectées
# par Dokploy via l'interface (Service > Environment Variables).
# Format obligatoire : ${VARIABLE_NAME} ou ${VARIABLE_NAME:-default}
#
# Si une variable est OPTIONNELLE (clef d'intégration externe), elle
# utilise la forme ${VAR:-} pour que le conteneur démarre même sans elle.
# =================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      # ── Core (OBLIGATOIRE) ──
      MONGO_URL: ${MONGO_URL}
      DB_NAME: ${DB_NAME:-sendbid}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      JWT_SECRET: ${JWT_SECRET}
      QR_HMAC_SECRET: ${QR_HMAC_SECRET}
      PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:-https://api.sendbid.app}

      # ── Admin & comptes de démo (OBLIGATOIRE) ──
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DEMO_CLIENT_EMAIL: ${DEMO_CLIENT_EMAIL}
      DEMO_CLIENT_PASSWORD: ${DEMO_CLIENT_PASSWORD}
      DEMO_CLIENT_PIN: ${DEMO_CLIENT_PIN}

      # ── CORS ──
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://sendfloo.sendbid.app,https://api.sendbid.app,https://admin.sendbid.app}

      # ── Stripe (paiements) ──
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

      # ── Twilio (SMS / OTP) ──
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_FROM_PHONE: ${TWILIO_FROM_PHONE:-}

      # ── SendGrid (email transactionnel) ──
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@sendbid.app}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-SENDBID}

      # ── PayPal (payouts) ──
      # NB : le code utilise PAYPAL_SECRET (pas PAYPAL_CLIENT_SECRET).
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_SECRET: ${PAYPAL_SECRET:-}
      PAYPAL_MODE: ${PAYPAL_MODE:-live}
      PAYPAL_PAYOUTS_ENABLED: ${PAYPAL_PAYOUTS_ENABLED:-false}

      # ── Firebase (push notifications) ──
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-/app/secrets/firebase-service-account.json}

      # ── KYC DIDIT ──
      DIDIT_API_KEY: ${DIDIT_API_KEY:-}
      DIDIT_WORKFLOW_ID: ${DIDIT_WORKFLOW_ID:-}

      # ── Google Maps ──
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}

      # ── Forex API (taux de change) ──
      FOREX_API_BASE: ${FOREX_API_BASE:-}
      FOREX_API_KEY: ${FOREX_API_KEY:-}
      SENDBID_APK_URL: ${SENDBID_APK_URL:-}
      PAYBID_APK_URL: ${PAYBID_APK_URL:-}

      # ── CinetPay (paiements Afrique de l'Ouest) ──
      CINETPAY_API_KEY: ${CINETPAY_API_KEY:-}
      CINETPAY_SITE_ID: ${CINETPAY_SITE_ID:-}
      CINETPAY_MODE: ${CINETPAY_MODE:-PROD}

      # ── Emergent LLM Universal Key (optionnel) ──
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY:-}

    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.sendbid-api.rule=Host(`${BACKEND_HOST:-api.sendbid.app}`) || Host(`${ADMIN_HOST:-admin.sendbid.app}`) || Host(`${DOWNLOAD_HOST:-sendbid.app}`)
      - traefik.http.routers.sendbid-api.entrypoints=websecure
      - traefik.http.routers.sendbid-api.tls.certresolver=letsencrypt
      - traefik.http.routers.sendbid-admin-root.rule=Host(`${ADMIN_HOST:-admin.sendbid.app}`) && Path(`/`)
      - traefik.http.routers.sendbid-admin-root.entrypoints=websecure
      - traefik.http.routers.sendbid-admin-root.tls.certresolver=letsencrypt
      - traefik.http.routers.sendbid-admin-root.middlewares=sendbid-admin-root-redirect
      - traefik.http.routers.sendbid-admin-root.service=sendbid-api
      - traefik.http.middlewares.sendbid-admin-root-redirect.redirectregex.regex=^https?://admin.sendbid.app/$
      - traefik.http.middlewares.sendbid-admin-root-redirect.redirectregex.replacement=https://admin.sendbid.app/api/web/admin
      - traefik.http.middlewares.sendbid-admin-root-redirect.redirectregex.permanent=true
      - traefik.http.routers.sendbid-download-root.rule=Host(`${DOWNLOAD_HOST:-sendbid.app}`) && Path(`/`)
      - traefik.http.routers.sendbid-download-root.entrypoints=websecure
      - traefik.http.routers.sendbid-download-root.tls.certresolver=letsencrypt
      - traefik.http.routers.sendbid-download-root.middlewares=sendbid-download-root-redirect
      - traefik.http.routers.sendbid-download-root.service=sendbid-api
      - traefik.http.middlewares.sendbid-download-root-redirect.redirectregex.regex=^https?://sendbid.app/$
      - traefik.http.middlewares.sendbid-download-root-redirect.redirectregex.replacement=https://sendbid.app/api/web/download
      - traefik.http.middlewares.sendbid-download-root-redirect.redirectregex.permanent=true
      - traefik.http.routers.sendbid-apk-download.rule=Host(`${DOWNLOAD_HOST:-sendbid.app}`) && Path(`/download/sendbid`)
      - traefik.http.routers.sendbid-apk-download.entrypoints=websecure
      - traefik.http.routers.sendbid-apk-download.tls.certresolver=letsencrypt
      - traefik.http.routers.sendbid-apk-download.middlewares=sendbid-apk-download-redirect
      - traefik.http.routers.sendbid-apk-download.service=sendbid-api
      - traefik.http.middlewares.sendbid-apk-download-redirect.redirectregex.regex=^https?://sendbid.app/download/sendbid$
      - traefik.http.middlewares.sendbid-apk-download-redirect.redirectregex.replacement=https://sendbid.app/api/web/download/sendbid
      - traefik.http.middlewares.sendbid-apk-download-redirect.redirectregex.permanent=true
      - traefik.http.routers.paybid-apk-download.rule=Host(`${DOWNLOAD_HOST:-sendbid.app}`) && Path(`/download/paybid`)
      - traefik.http.routers.paybid-apk-download.entrypoints=websecure
      - traefik.http.routers.paybid-apk-download.tls.certresolver=letsencrypt
      - traefik.http.routers.paybid-apk-download.middlewares=paybid-apk-download-redirect
      - traefik.http.routers.paybid-apk-download.service=sendbid-api
      - traefik.http.middlewares.paybid-apk-download-redirect.redirectregex.regex=^https?://sendbid.app/download/paybid$
      - traefik.http.middlewares.paybid-apk-download-redirect.redirectregex.replacement=https://sendbid.app/api/web/download/paybid
      - traefik.http.middlewares.paybid-apk-download-redirect.redirectregex.permanent=true
      - traefik.http.services.sendbid-api.loadbalancer.server.port=8000
      # Middleware optionnel : rediriger HTTP vers HTTPS en production
      # - traefik.http.routers.sendbid-api.middlewares=redirect-to-https
      # - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
    name: dokploy-network
