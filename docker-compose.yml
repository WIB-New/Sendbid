version: "3.8"

# =================================================================
# Dokploy SENDBID/PAYBID — Docker Compose (audité 12/06/2026)
#
# IMPORTANT : Aucune valeur en dur. Toutes les variables sont injectées
# par Dokploy via l'interface (Service > Environment Variables).
# Format obligatoire : ${VARIABLE_NAME} ou ${VARIABLE_NAME:-default}
#
# Si une variable est OPTIONNELLE (clef d'intégration externe), elle
# utilise la forme ${VAR:-} pour que le conteneur démarre même sans elle.
# =================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      # ── Core (OBLIGATOIRE) ──
      MONGO_URL: ${MONGO_URL}
      DB_NAME: ${DB_NAME:-sendbid}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      JWT_SECRET: ${JWT_SECRET}
      QR_HMAC_SECRET: ${QR_HMAC_SECRET}
      PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:-https://senfloosendbid-sendbidbackend-4qvjcs-734725-195-110-35-155.sslip.io}

      # ── Admin & comptes de démo (OBLIGATOIRE) ──
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DEMO_CLIENT_EMAIL: ${DEMO_CLIENT_EMAIL}
      DEMO_CLIENT_PASSWORD: ${DEMO_CLIENT_PASSWORD}
      DEMO_CLIENT_PIN: ${DEMO_CLIENT_PIN}

      # ── CORS ──
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://senfloosendbid-sendbidfrontend-wtic4z-61bc59-195-110-35-155.sslip.io,https://senfloosendbid-sendbidbackend-4qvjcs-734725-195-110-35-155.sslip.io}

      # ── Stripe (paiements) ──
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

      # ── Twilio (SMS / OTP) ──
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_FROM_PHONE: ${TWILIO_FROM_PHONE:-}

      # ── SendGrid (email transactionnel) ──
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@sendbid.app}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-SENDBID}

      # ── PayPal (payouts) ──
      # NB : le code utilise PAYPAL_SECRET (pas PAYPAL_CLIENT_SECRET).
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_SECRET: ${PAYPAL_SECRET:-}
      PAYPAL_MODE: ${PAYPAL_MODE:-live}
      PAYPAL_PAYOUTS_ENABLED: ${PAYPAL_PAYOUTS_ENABLED:-false}

      # ── Firebase (push notifications) ──
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-/app/secrets/firebase-service-account.json}

      # ── KYC DIDIT ──
      DIDIT_API_KEY: ${DIDIT_API_KEY:-}
      DIDIT_WORKFLOW_ID: ${DIDIT_WORKFLOW_ID:-}

      # ── Google Maps ──
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}

      # ── Forex API (taux de change) ──
      FOREX_API_BASE: ${FOREX_API_BASE:-}
      FOREX_API_KEY: ${FOREX_API_KEY:-}

      # ── CinetPay (paiements Afrique de l'Ouest) ──
      CINETPAY_API_KEY: ${CINETPAY_API_KEY:-}
      CINETPAY_SITE_ID: ${CINETPAY_SITE_ID:-}
      CINETPAY_MODE: ${CINETPAY_MODE:-PROD}

      # ── Emergent LLM Universal Key (optionnel) ──
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY:-}

    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.sendbid-api.rule=Host(`senfloosendbid-sendbidbackend-4qvjcs-734725-195-110-35-155.sslip.io`)
      - traefik.http.routers.sendbid-api.entrypoints=web
      - traefik.http.services.sendbid-api.loadbalancer.server.port=8000
    networks:
      - dokploy-network

  # =================================================================
  # FRONTEND — Expo Web build statique servi par nginx
  # =================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_BACKEND_URL: ${EXPO_PUBLIC_BACKEND_URL:-http://senfloosendbid-sendbidbackend-4qvjcs-734725-195-110-35-155.sslip.io}
        EXPO_PUBLIC_STRIPE_PK: ${EXPO_PUBLIC_STRIPE_PK:-}
        EXPO_PUBLIC_APP_VARIANT: ${EXPO_PUBLIC_APP_VARIANT:-sendbid}
        GOOGLE_MAPS_IOS_API_KEY: ${GOOGLE_MAPS_IOS_API_KEY:-}
        GOOGLE_MAPS_ANDROID_API_KEY: ${GOOGLE_MAPS_ANDROID_API_KEY:-}
    restart: always
    expose:
      - "80"
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.sendbid-frontend.rule=Host(`${FRONTEND_HOST:-senfloosendbid-sendbidfrontend-wtic4z-61bc59-195-110-35-155.sslip.io}`)
      - traefik.http.routers.sendbid-frontend.entrypoints=web
      - traefik.http.services.sendbid-frontend.loadbalancer.server.port=80
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
    name: dokploy-network
